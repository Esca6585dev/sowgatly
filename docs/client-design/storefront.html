<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Sowgatly Storefront</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: sticky store header → banner rail → category rail → product shelves; account = side tabs + content. Mobile adds a bottom tab bar. */
:root{
  --brand-1:#FF6A00; --brand-2:#FF2A00; --brand:#F5470F; --brand-soft:#FFF0E8; --brand-ink:#C2360A;
  --bg:#FAF7F4; --surface:#FFFFFF; --surface-2:#F5F0EC; --line:#EFE7E1;
  --text:#1E1714; --muted:#857870; --shadow:0 1px 2px rgba(60,30,10,.04),0 10px 30px rgba(60,30,10,.07);
  --ok:#14A06B; --ok-bg:#E6F6EF; --info:#2F6FEB; --info-bg:#E8F0FE; --warn:#C77700; --warn-bg:#FFF3DC;
  --violet:#7A4CE0; --violet-bg:#F0EAFD; --bad:#D9334A; --bad-bg:#FDE8EB; --star:#F5A524;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#FF6A2B; --brand-soft:#3A1E12; --brand-ink:#FF9A6B;
  --bg:#13100E; --surface:#1C1815; --surface-2:#25201C; --line:#2E2823;
  --text:#F4EDE8; --muted:#A3958C; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --ok:#3CCB8F; --ok-bg:#12291F; --info:#6E9BFF; --info-bg:#162238; --warn:#F2B04A; --warn-bg:#2E2412;
  --violet:#A98BFF; --violet-bg:#231B38; --bad:#FF6B7F; --bad-bg:#33171C; color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#FF6A2B; --brand-soft:#3A1E12; --brand-ink:#FF9A6B;
  --bg:#13100E; --surface:#1C1815; --surface-2:#25201C; --line:#2E2823;
  --text:#F4EDE8; --muted:#A3958C; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);
  --ok:#3CCB8F; --ok-bg:#12291F; --info:#6E9BFF; --info-bg:#162238; --warn:#F2B04A; --warn-bg:#2E2412;
  --violet:#A98BFF; --violet-bg:#231B38; --bad:#FF6B7F; --bad-bg:#33171C; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.ico{display:inline-flex;width:20px;height:20px;flex:none}.ico svg{width:100%;height:100%}
.shell{width:100%;min-width:0;max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,3vw,32px)}
.cats,.grid,.banners{min-width:0;max-width:100%}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .shell{display:flex;align-items:center;gap:14px;min-height:72px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo svg{width:40px;height:40px}
.logo b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em}
.city{display:flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:8px 12px;font-weight:600;font-size:13px;color:var(--text)}
.city .ico{width:16px;height:16px;color:var(--brand)}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:0 14px;min-width:0}
.search:focus-within{border-color:var(--brand);background:var(--surface)}
.search .ico{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:12px 0}
.langs{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.langs button{border:0;background:transparent;padding:6px 9px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted)}
.langs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.iconbtn{position:relative;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text);flex:none}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface)}
.me-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));font-size:13px;flex:none}

/* sections */
main{padding-block:22px 110px;display:flex;flex-direction:column;gap:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-family:var(--f-display);font-size:20px;font-weight:600}
.link{border:0;background:none;color:var(--brand-ink);font-weight:700;font-size:14px;padding:4px}

/* banners */
.banners{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
.ban{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:170px;color:#fff;border:0;text-align:left}
.ban.hero{grid-row:span 2;min-height:360px;background:linear-gradient(135deg,var(--brand-1),var(--brand-2))}
.ban.hero h1{font-family:var(--f-display);font-size:clamp(26px,3.4vw,40px);font-weight:700;line-height:1.08;max-width:15ch;letter-spacing:-.02em}
.ban.hero p{max-width:38ch;opacity:.92;margin:0}
.ban .art{position:absolute;right:0;top:0;bottom:0;width:min(46%,340px);pointer-events:none;display:flex;align-items:center}
.ban .art svg,.ban .art-sm svg{width:100%;height:auto;display:block}
.ban .art svg>rect:first-of-type,.ban .art-sm svg>rect:first-of-type{fill:transparent}
.ban .art svg>circle:first-of-type,.ban .art-sm svg>circle:first-of-type{opacity:.25}
.ban .cta{align-self:flex-start;margin-top:8px;border:0;border-radius:12px;background:#fff;color:var(--brand-ink);font-weight:800;padding:12px 18px}
.ban.b2{background:linear-gradient(135deg,#7A4CE0,#C06CFF)}
.ban.b3{background:linear-gradient(135deg,#14A06B,#5BD6A2)}
.ban small{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;opacity:.9}
.ban h3{font-family:var(--f-display);font-size:19px;font-weight:600;max-width:16ch}
.ban .code{align-self:flex-start;display:inline-block;margin-top:4px;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.2);font-weight:800;letter-spacing:.06em;font-size:13px}
.ban .art-sm{position:absolute;right:4px;bottom:0;width:128px}
.ban h1,.ban h3,.ban p,.ban small,.ban .cta,.ban .code{position:relative}

/* categories */
.cats{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:12px}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;color:var(--text)}
.cat .disc{width:100%;aspect-ratio:1;max-width:96px;border-radius:26px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--brand);transition:transform .15s ease,border-color .15s}
.cat .disc .ico{width:34px;height:34px}
.cat span{font-size:12.5px;font-weight:600;text-align:center;line-height:1.25}
.cat:hover .disc,.cat.on .disc{border-color:var(--brand);background:var(--brand-soft)}
.cat:hover .disc{transform:translateY(-2px)}

/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .pic{position:relative;aspect-ratio:1;background:var(--surface-2)}
.picbtn{border:0;padding:0;background:none;display:block;width:100%;height:100%}
.card .pic svg{display:block;width:100%;height:100%}
.tag{position:absolute;left:10px;top:10px;background:var(--brand);color:#fff;font-size:12px;font-weight:800;border-radius:8px;padding:3px 8px}
.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#1E1714}
.heart .ico{width:18px;height:18px}
.heart.on{color:#E5484D}.heart.on svg path{fill:currentColor}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .name{font-weight:700;font-size:15px;line-height:1.3;border:0;background:none;padding:0;text-align:left}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.stars{display:inline-flex;align-items:center;gap:3px;color:var(--text);font-weight:700}
.stars .ico{width:14px;height:14px;color:var(--star)}.stars svg path{fill:currentColor}
.eta{display:inline-flex;align-items:center;gap:4px;background:var(--ok-bg);color:var(--ok);font-weight:700;border-radius:999px;padding:2px 8px;font-size:12px}
.eta .ico{width:13px;height:13px}
.price-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}
.price{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.old{color:var(--muted);text-decoration:line-through;font-size:12.5px;font-weight:600;display:block;font-family:var(--f-body)}
.add{border:0;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 14px rgba(255,74,0,.25)}
.step{display:flex;align-items:center;background:var(--brand-soft);border-radius:13px;height:42px}
.step button{border:0;background:none;width:34px;height:42px;color:var(--brand-ink);display:grid;place-items:center}
.step b{min-width:18px;text-align:center;color:var(--brand-ink)}
.step .ico{width:16px;height:16px}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));box-shadow:0 8px 18px rgba(255,74,0,.25)}
.btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:none}
.btn.block{width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:var(--surface)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;font-weight:700;text-align:left;display:flex;align-items:center;gap:10px}
.seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}

/* product page */
.crumbs{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);font-weight:600}
.pdp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:32px;align-items:start}
.pdp .big{border-radius:28px;overflow:hidden;border:1px solid var(--line);position:relative}
.pdp .big svg{display:block;width:100%;height:auto}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumbs div{width:72px;border-radius:14px;overflow:hidden;border:2px solid transparent}
.thumbs div.on{border-color:var(--brand)}
.thumbs svg{display:block;width:100%;height:auto}
.pdp h1{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);font-weight:600;line-height:1.15}
.pdp .price{font-size:28px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;font-weight:600}
.shopcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px}
.shopcard .avatar{width:44px;height:44px;font-size:15px}
.shopcard b{display:block}.shopcard small{color:var(--muted)}
.buybar{display:flex;gap:10px;align-items:center}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;height:50px}
.qty button{border:0;background:none;width:44px;height:50px;display:grid;place-items:center}
.qty b{min-width:26px;text-align:center}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.perk{background:var(--surface-2);border-radius:14px;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.perk .ico{color:var(--brand)}
.perk b{font-size:13px}

/* cart & checkout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.line{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .thumb{width:78px;border-radius:14px;overflow:hidden;flex:none}
.line .thumb svg{display:block;width:100%;height:auto}
.line .info{flex:1;min-width:0}
.line .info b{display:block}
.line .info small{color:var(--muted)}
.sum{display:flex;flex-direction:column;gap:10px;position:sticky;top:96px}
.sum .row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.sum .row.total{font-family:var(--f-display);font-size:19px;font-weight:600;border-top:1px solid var(--line);padding-top:12px}
.promo{display:flex;gap:8px}.promo input{flex:1;min-width:0}
.empty{text-align:center;padding:48px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted)}
.empty .ico{width:56px;height:56px;color:var(--brand)}
.empty h3{color:var(--text);font-family:var(--f-display);font-weight:600}

/* account */
.acc{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.acc-side{position:sticky;top:96px;display:flex;flex-direction:column;gap:4px;padding:14px}
.acc-user{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.acc-user .avatar{width:46px;height:46px;font-size:16px}
.acc-user b{display:block}.acc-user small{color:var(--muted);font-size:13px}
.tab{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.on{background:var(--brand-soft);color:var(--brand-ink)}
.tab .cnt{margin-left:auto;background:var(--brand);color:#fff;font-size:11px;border-radius:999px;padding:1px 8px;font-weight:800}
.tab.out{color:var(--bad)}
.acc-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.acc-main>h2{font-family:var(--f-display);font-size:22px;font-weight:600}
.order{display:flex;flex-direction:column;gap:14px}
.order-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.order-h b{font-family:var(--f-display);font-weight:600}
.order-h small{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-pending{color:var(--warn);background:var(--warn-bg)}.p-processing{color:var(--violet);background:var(--violet-bg)}
.p-delivering{color:var(--info);background:var(--info-bg)}.p-completed{color:var(--ok);background:var(--ok-bg)}.p-cancelled{color:var(--bad);background:var(--bad-bg)}
.order-items{display:flex;gap:8px;flex-wrap:wrap}
.order-items div{width:56px;border-radius:12px;overflow:hidden}
.order-items svg{display:block;width:100%;height:auto}
.order-f{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.order-f .num{font-family:var(--f-display);font-weight:600}
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:4px}
.track .st{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;font-size:12px;color:var(--muted);font-weight:600}
.track .st::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--line)}
.track .st:first-child::before{display:none}
.track .st.done::before,.track .st.now::before{background:linear-gradient(90deg,var(--brand-1),var(--brand-2))}
.track .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);position:relative;z-index:1;color:var(--muted)}
.track .dot .ico{width:14px;height:14px}
.track .done .dot{background:var(--brand);border-color:var(--brand);color:#fff}
.track .now .dot{background:var(--surface);border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft)}
.track .done,.track .now{color:var(--text)}
.track time{font-size:11px;color:var(--muted);font-weight:600}
.courier{display:flex;align-items:center;gap:12px;background:var(--info-bg);border-radius:14px;padding:12px 14px}
.courier .ico{color:var(--info)}
.courier b{display:block}.courier small{color:var(--muted)}
.addr{display:flex;gap:14px;align-items:flex-start}
.addr .ico{color:var(--brand);margin-top:2px}
.addr .txt{flex:1;min-width:0}
.addr .txt b{display:flex;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:800;background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:2px 8px}
.small-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
.small-btn.danger{color:var(--bad)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch small{display:block;color:var(--muted)}
.tgl{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on{background:var(--brand)}.tgl.on::after{left:21px}
.lang-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lang-pick button{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px;font-weight:700}
.lang-pick button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.signin{max-width:420px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;text-align:center}
.signin .logo{justify-content:center}

/* footer, toast, bottom bar */
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:13px}
footer .shell{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:.2s;z-index:60;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tabbar{display:none}

@media (max-width:980px){
  .langs,.city,.me-btn .nm{display:none}
  .banners{grid-template-columns:1fr;grid-template-rows:auto}
  .ban.hero{grid-row:auto;min-height:300px;padding-top:150px}
  .ban.hero .art{left:auto;right:8px;top:8px;bottom:auto;width:150px}

const STEPS=['pending','processing','delivering','completed'];
function track(o){
  const idx=o.st==='cancelled'?0:STEPS.indexOf(o.st);
  return `<div class="track">${STEPS.map((s,i)=>{const cls=o.st==='completed'||i<idx?'done':i===idx?'now':'';const icon=['receipt','gift','truck','check'][i];return `<div class="st ${cls}"><span class="dot">${ico(cls==='done'?'check':icon)}</span><span>${t('st_'+s)}</span><time>${o.times[i]||'—'}</time></div>`}).join('')}</div>`;
}
function orderCard(o,full){
  const pill=`<span class="pill p-${o.st}">${t('st_'+o.st)}</span>`;
  return `<article class="panel order">
   <div class="order-h"><b>${t('order')} № ${o.no}</b>${pill}<small style="margin-left:auto">${fmtDate(o.date)}</small></div>
   ${full&&o.st!=='cancelled'?track(o):''}
   ${full&&o.st==='delivering'?`<div class="courier">${ico('truck')}<div style="flex:1"><b>${t('courier')}: ${o.courier}</b><small>${t('eta')} ${o.eta} · ${nm(S.addresses[o.addr].label)}</small></div><button class="small-btn">${t('call')}</button></div>`:''}
   <div class="order-items">${o.items.map(it=>`<div title="${nm(byId(it.id))}">${pic(byId(it.id))}</div>`).join('')}</div>
   <div class="order-f"><span class="num">${money(orderTotal(o))}</span><div style="display:flex;gap:8px;flex-wrap:wrap">
    ${o.st==='pending'||o.st==='processing'?`<button class="small-btn danger" data-cancel="${o.no}">${t('cancel')}</button>`:''}
    ${o.st==='completed'?`<button class="small-btn">${t('leaveReview')}</button>`:''}
    ${o.st==='completed'||o.st==='cancelled'?`<button class="small-btn" data-reorder="${o.no}">${ico('repeat')} ${t('reorder')}</button>`:''}
    <button class="small-btn" data-msg="1">${t('writeShop')}</button></div></div>
  </article>`;
}

  if(S.tab==='profile')body=`<h2>${t('profile')}</h2><form class="panel" id="profileForm" style="display:flex;flex-direction:column;gap:16px" novalidate>
    <div style="display:flex;align-items:center;gap:14px"><span class="avatar" style="width:64px;height:64px;font-size:22px">${initials(S.user.name)}</span><div><b style="font-size:18px">${S.user.name}</b><div style="color:var(--muted);font-size:13px">${S.user.phone}</div></div></div>
    <div class="form-grid"><div class="field"><label for="pname">${t('name')}</label><input id="pname" value="${S.user.name}"></div><div class="field"><label for="pemail">${t('email')}</label><input id="pemail" type="email" value="${S.user.email}"></div>
    <div class="field"><label for="pphone">${t('phone')}</label><input id="pphone" value="${S.user.phone}" inputmode="tel"><small style="color:var(--muted)">${t('phoneNote')}</small></div><div class="field"><label for="pbday">${t('birthday')}</label><input id="pbday" type="date" value="${S.user.birthday}"></div></div>
    <button class="btn" data-act="saveprofile" style="align-self:flex-start">${t('save')}</button></form>`;
  if(S.tab==='settings'){const dark=document.documentElement.dataset.theme==='dark';body=`<h2>${t('settings')}</h2>
    <section class="panel" style="display:flex;flex-direction:column;gap:12px"><h3>${t('language')}</h3><div class="lang-pick">${LANGS.map(([c,,full])=>`<button class="${c===lang?'on':''}" data-lang="${c}">${full}</button>`).join('')}</div></section>
    <section class="panel" style="display:flex;flex-direction:column;gap:12px"><h3>${t('theme')}</h3><div class="seg"><button class="${!dark?'on':''}" data-settheme="light">${ico('sun')}<b>${t('light')}</b></button><button class="${dark?'on':''}" data-settheme="dark">${ico('moon')}<b>${t('dark')}</b></button></div></section>
    <section class="panel"><h3 style="margin-bottom:4px">${t('notifications')}</h3>${[['orders','nOrders','nOrdersS'],['promo','nPromo','nPromoS'],['dates','nDates','nDatesS']].map(([k,a,b])=>`<div class="switch"><div><b>${t(a)}</b><small>${t(b)}</small></div><button class="tgl ${S.notif[k]?'on':''}" data-notif="${k}" role="switch" aria-checked="${S.notif[k]}" aria-label="${t(a)}"></button></div>`).join('')}</section>
    <button class="small-btn danger" style="align-self:flex-start">${t('deleteAccount')}</button>`}
  return `<div class="shell"><div class="acc">
   <aside class="panel acc-side"><div class="acc-user"><span class="avatar">${initials(S.user.name)}</span><div style="min-width:0"><b>${t('hello',{n:S.user.name.split(' ')[0]})}</b><small>${S.user.phone}</small></div></div>
    ${tabs.map(([k,i,l,c])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${ico(i)}${t(l)}${c?`<span class="cnt">${c}</span>`:''}</button>`).join('')}
    <button class="tab out" data-act="logout">${ico('logout')}${t('logout')}</button></aside>
   <section class="acc-main">${body}</section></div></div>`;
}
function render(){
  uid=0;chrome();
  const v={home:vHome,catalog:vCatalog,product:vProduct,cart:vCart,checkout:vCheckout,favorites:vFavorites,account:vAccount}[S.view]||vHome;
  app.innerHTML=v();
  try{localStorage.setItem('sg-store',JSON.stringify({lang}))}catch(e){}
}

/* ---------------- actions ---------------- */
function addToCart(id,n=1){const c=S.cart.find(x=>x.id===id);if(c)c.q+=n;else S.cart.push({id,q:n});}
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-go]');if(!el)return;const d=el.dataset;
  if(d.lang){lang=d.lang;render();return}
  if(d.go){if(d.go==='catalog')S.cat=null,S.q='';go(d.go);return}
  if(d.cat){go('catalog',{cat:+d.cat,q:''});return}
  if(d.pid){go('product',{pid:+d.pid});return}
  if(d.fav){const id=+d.fav;S.fav.has(id)?(S.fav.delete(id),toast(t('favRemoved'))):(S.fav.add(id),toast(t('favAdded')));render();return}
  if(d.add){addToCart(+d.add);toast(t('added'));render();return}
  if(d.buy){if(!S.cart.find(c=>c.id===+d.buy))addToCart(+d.buy);go('checkout');return}
  if(d.inc){addToCart(+d.inc);render();return}
  if(d.dec){const c=S.cart.find(x=>x.id===+d.dec);if(c){c.q--;if(c.q<=0)S.cart=S.cart.filter(x=>x!==c)}render();return}
  if(d.rm){S.cart=S.cart.filter(x=>x.id!==+d.rm);render();return}
  if(d.when){S.when=d.when;render();return}
  if(d.pay){S.pay=d.pay;render();return}
  if(d.tab){S.tab=d.tab;render();return}
  if(d.msg){toast(t('messageSent'));return}
  if(d.cancel){const o=S.orders.find(x=>x.no===d.cancel);o.st='cancelled';toast(t('cancelled'));render();return}
  if(d.reorder){S.orders.find(x=>x.no===d.reorder).items.forEach(it=>addToCart(it.id,it.q));toast(t('reordered'));go('cart');return}
  if(d.def){S.addresses.forEach((a,i)=>a.def=i===+d.def);render();return}
  if(d.deladdr){S.addresses.splice(+d.deladdr,1);if(S.addresses.length&&!S.addresses.some(a=>a.def))S.addresses[0].def=true;toast(t('addrDeleted'));render();return}
  if(d.notif){S.notif[d.notif]=!S.notif[d.notif];render();return}
  if(d.settheme){document.documentElement.dataset.theme=d.settheme;render();return}
  if(d.act==='theme'){const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark';render();return}
  if(d.act==='promo'){e.preventDefault();const v=(document.getElementById('promo').value||'').trim().toUpperCase();S.promo=v==='SOWGAT15';toast(S.promo?t('promoOk'):t('promoBad'));render();return}
  if(d.act==='place'){e.preventDefault();const no=String(149+S.orders.filter(o=>+o.no>=149).length).padStart(7,'0');const now=new Date();const hh=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    S.orders.unshift({no,st:'pending',date:now.toISOString(),items:S.cart.map(c=>({...c})),fee:sums().fee,courier:null,eta:'—',times:[hh,'','',''],addr:+document.getElementById('raddr').value});S.cart=[];S.promo=false;S.signedIn=true;toast(t('orderPlaced')+' № '+no);go('account',{tab:'orders'});return}
  if(d.act==='addaddr'){e.preventDefault();const lb=document.getElementById('alabel').value.trim(),ln=document.getElementById('aline').value.trim();if(!ln){document.getElementById('aline').focus();return}S.addresses.push({label:{tm:lb||'Salgy',ru:lb||'Адрес',en:lb||'Address',tr:lb||'Adres'},line:ln,def:!S.addresses.length});toast(t('addrSaved'));render();return}
  if(d.act==='saveprofile'){e.preventDefault();S.user.name=document.getElementById('pname').value.trim()||S.user.name;S.user.email=document.getElementById('pemail').value.trim();S.user.phone=document.getElementById('pphone').value.trim()||S.user.phone;S.user.birthday=document.getElementById('pbday').value;toast(t('saved'));render();return}
  if(d.act==='logout'){S.signedIn=false;render();return}
  if(d.act==='signin'){e.preventDefault();S.signedIn=true;S.tab='orders';toast(t('welcome'));render();return}
});
document.addEventListener('submit',e=>e.preventDefault());
const qEl=document.getElementById('q');
qEl.addEventListener('input',()=>{S.q=qEl.value;if(S.q.trim()){if(S.view!=='catalog'){S.view='catalog';S.cat=null}app.innerHTML=vCatalog();}else if(S.view==='catalog'){app.innerHTML=vCatalog()}});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){qEl.blur();render()}});
try{const saved=JSON.parse(localStorage.getItem('sg-store')||'{}');if(saved.lang&&LANGS.some(l=>l[0]===saved.lang))lang=saved.lang}catch(e){}
const h=(location.hash||'').slice(1);if(['catalog','cart','checkout','favorites','account'].includes(h))S.view=h;
render();
</script>
</body></html>

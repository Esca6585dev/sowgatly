<!doctype html><html lang="tk"><head><meta charset="utf-8"><title>Sowgatly logo</title>
<style>
*{box-sizing:border-box;margin:0}body{font:14px/1.4 "Inter",system-ui,sans-serif;background:#FAF7F4;color:#1E1714;padding:36px 40px}
h1{font-size:22px;margin-bottom:4px}p.sub{color:#8A7D75;margin-bottom:24px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.col{background:#fff;border:1px solid #EFE7E1;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.col h2{font-size:16px}.col h2 small{color:#8A7D75;font-weight:500;margin-left:6px}
.big{display:flex;gap:16px;align-items:center}
.big img.app{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 26px rgba(255,60,0,.28)}
.big img.mark{width:96px;height:96px}
.lock{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#FAF7F4}
.lock img{width:40px;height:40px;border-radius:10px}.lock b{font-size:22px;letter-spacing:-.02em}
.lock.dark{background:#13100E;color:#F4EDE8}
.sizes{display:flex;align-items:flex-end;gap:12px}.sizes img{border-radius:22%}
.old{opacity:.9}
</style></head><body>
<h1>Täze logo: sowgat gutusy</h1><p class="sub">Reňk logonyň öňki gradienti: #FF6A00 → #FF2A00. Çepde köne logo deňeşdirmek üçin.</p>
<div class="row">
  <div class="col old"><h2>Köne<small>lale</small></h2>
    <div class="big"><img class="app" src="../admin-design/logo.png"></div>
    <div class="lock"><img src="../admin-design/logo.png"><b>sowgatly</b></div>
    <div class="lock dark"><img src="../admin-design/logo.png"><b>sowgatly</b></div>
    <div class="sizes"><img src="../admin-design/logo.png" width="64"><img src="../admin-design/logo.png" width="40"><img src="../admin-design/logo.png" width="24"></div>
  </div>
  <div class="col"><h2>1 · Lenta<small>gutu + ýüpek bant</small></h2>
    <div class="big"><img class="app" src="logo-1-lenta.svg"><img class="mark" src="logo-1-lenta-mark.svg"></div>
    <div class="lock"><img src="logo-1-lenta.svg"><b>sowgatly</b></div>
    <div class="lock dark"><img src="logo-1-lenta.svg"><b>sowgatly</b></div>
    <div class="sizes"><img src="logo-1-lenta.svg" width="64"><img src="logo-1-lenta.svg" width="40"><img src="logo-1-lenta.svg" width="24"></div>
  </div>
  <div class="col"><h2>2 · Lale<small>gutudan çykýan lale</small></h2>
    <div class="big"><img class="app" src="logo-2-lale.svg"><img class="mark" src="logo-2-lale-mark.svg"></div>
    <div class="lock"><img src="logo-2-lale.svg"><b>sowgatly</b></div>
    <div class="lock dark"><img src="logo-2-lale.svg"><b>sowgatly</b></div>
    <div class="sizes"><img src="logo-2-lale.svg" width="64"><img src="logo-2-lale.svg" width="40"><img src="logo-2-lale.svg" width="24"></div>
  </div>
  <div class="col"><h2>3 · Doly<small>doldurylan gutu</small></h2>
    <div class="big"><img class="app" src="logo-3-dolly.svg"><img class="mark" src="logo-3-dolly-mark.svg"></div>
    <div class="lock"><img src="logo-3-dolly.svg"><b>sowgatly</b></div>
    <div class="lock dark"><img src="logo-3-dolly.svg"><b>sowgatly</b></div>
    <div class="sizes"><img src="logo-3-dolly.svg" width="64"><img src="logo-3-dolly.svg" width="40"><img src="logo-3-dolly.svg" width="24"></div>
  </div>
</div></body></html>
